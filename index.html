
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webserver Dashboard</title>

<style>
:root {
    color-scheme: dark;

    --bg: #11151b;
    --header: #171d25;
    --surface: #1b232d;
    --surface-hover: #222d39;
    --border: #303b48;

    --text: #e7ebef;
    --muted: #9ba7b4;
    --subtle: #758291;

    --accent: #8da6b8;
    --accent-hover: #aec2d0;

    --danger: #e58c85;

    --radius: 10px;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    font-size: 14px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}

/* Header */

header {
    padding: 27px 5%;
    background: var(--header);
    border-bottom: 1px solid var(--border);
}

.header-content {
    max-width: 1500px;
    margin: 0 auto;
}

header h1 {
    margin: 0 0 4px;
    font-size: 23px;
    font-weight: 650;
    letter-spacing: -0.5px;
}

header p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
}

/* Main layout */

main {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 30px 5% 55px;
}

/* Toolbar */

.toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 27px;
}

input {
    flex: 1;
    min-width: 220px;
    min-height: 44px;
    padding: 11px 15px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    color: var(--text);
    font: inherit;
    font-size: 13px;

    outline: none;
    transition: border-color .15s ease,
                background .15s ease;
}

input::placeholder {
    color: var(--subtle);
}

input:focus {
    border-color: var(--accent);
    background: #202a35;
}

button {
    min-height: 44px;
    padding: 10px 16px;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);

    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 550;

    cursor: pointer;
    transition: background .15s ease,
                border-color .15s ease,
                color .15s ease;
}

button:hover {
    background: var(--surface-hover);
    border-color: #536273;
}

button:active {
    background: #293644;
}

button:focus-visible,
.card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
}

.primary {
    background: #354858;
    border-color: #465e70;
    color: #f0f4f6;
}

.primary:hover {
    background: #405769;
    border-color: #60798c;
}

/* Breadcrumb navigation */

#breadcrumb {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;

    margin: 0 0 34px;
    color: var(--muted);
    font-size: 13px;
}

#breadcrumb span {
    cursor: pointer;
    transition: color .15s ease;
}

#breadcrumb span:hover {
    color: var(--accent-hover);
}

/* Sections */

.section {
    margin-top: 35px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 17px;
}

.section-title h2 {
    margin: 0;
    color: #c5cdd5;
    font-size: 13px;
    font-weight: 650;
    letter-spacing: 1px;
}

.count {
    color: var(--subtle);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}

/* Directory grid */

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(210px, 1fr)
    );
    gap: 13px;
}

/* File and folder cards */

.card {
    position: relative;
    min-width: 0;
    min-height: 150px;
    padding: 19px;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;

    cursor: pointer;

    transition:
        background .16s ease,
        border-color .16s ease,
        transform .16s ease;
}

.card:hover {
    background: var(--surface-hover);
    border-color: #536273;
    transform: translateY(-2px);
}

.card:active {
    transform: translateY(0);
}

.card-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 43px;
    margin-bottom: 13px;

    font-size: 29px;
    line-height: 1;
}

.card-name {
    max-width: 100%;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.card-meta {
    margin-top: 6px;
    color: var(--muted);
    font-size: 12px;
}

/* Empty state */

.empty {
    grid-column: 1 / -1;
    padding: 24px;

    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);

    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

/* Status */

#status {
    margin-top: 38px;
    padding-top: 17px;

    border-top: 1px solid var(--border);

    color: var(--subtle);
    font-size: 12px;
}

.error {
    color: var(--danger);
}

/* Footer */

footer {
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px 5% 27px;

    border-top: 1px solid var(--border);

    color: var(--subtle);
    font-size: 11px;
    text-align: center;
}

/* Responsive layout */

@media (min-width: 1100px) {
    .grid {
        grid-template-columns: repeat(
            auto-fill,
            minmax(230px, 1fr)
        );
    }
}

@media (max-width: 700px) {
    header {
        padding: 23px 20px;
    }

    main {
        padding: 22px 20px 40px;
    }

    .toolbar {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
    }

    .toolbar input {
        grid-column: 1 / -1;
        width: 100%;
    }

    .toolbar button {
        width: 100%;
        padding: 10px 8px;
    }

    .grid {
        grid-template-columns: repeat(
            auto-fill,
            minmax(145px, 1fr)
        );
        gap: 10px;
    }

    .card {
        min-height: 135px;
        padding: 15px;
    }

    .section {
        margin-top: 29px;
    }
}

@media (max-width: 380px) {
    .toolbar {
        grid-template-columns: 1fr;
    }

    .toolbar input {
        grid-column: auto;
    }

    .grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>🖥️ Claude Dashboard</h1>
    </div>
</header>

<main>

    <div class="toolbar">
        <input
            type="search"
            id="search"
            placeholder="🔍 Search folders and HTML files..."
        >

        <button onclick="loadDirectory()">
            ↻ Refresh
        </button>

        <button onclick="goBack()">
            ← Back
        </button>

        <button class="primary" onclick="goHome()">
            🏠 Home
        </button>
    </div>

    <div id="breadcrumb"></div>

    <section class="section">
        <div class="section-title">
            <h2>📁 FOLDERS</h2>
            <span class="count" id="folderCount">0</span>
        </div>
        <div class="grid" id="folders"></div>
    </section>

    <section class="section">
        <div class="section-title">
            <h2>🌐 HTML PAGES</h2>
            <span class="count" id="fileCount">0</span>
        </div>
        <div class="grid" id="files"></div>
    </section>

    <div id="status">Initializing...</div>

</main>

<footer>
    NGINX Directory API · Claude Dashboard
</footer>

<script>

const API = "/api/";

let currentPath = "";
let historyStack = [];
let searchQuery = "";

async function loadDirectory() {

    const status = document.getElementById("status");

    status.textContent = "Loading directory...";

    try {

        const response = await fetch(
            API + currentPath,
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const entries = await response.json();

        const folders = [];
        const files = [];

        entries.forEach(item => {

            if (!item.name || item.name === "../") {
                return;
            }

            if (item.type === "directory") {
                folders.push(item);
            }

            else if (
                item.type === "file" &&
                item.name.toLowerCase().endsWith(".html") && 
                item.name.toLowerCase() !== "index.html"
            ) {
                files.push(item);
            }

        });

        folders.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        files.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        renderFolders(folders);
        renderFiles(files);

        renderBreadcrumb();

        document.getElementById("folderCount").textContent =
            folders.length;

        document.getElementById("fileCount").textContent =
            files.length;

        status.textContent =
            "Connected to NGINX API · " +
            folders.length + " folders · " +
            files.length + " HTML pages";

        applySearch();

    } catch (error) {

        status.innerHTML =
            '<span class="error">API Error: ' +
            escapeHTML(error.message) +
            '</span>';

    }
}

function renderFolders(items) {
    const container = document.getElementById("folders");
    container.innerHTML = "";

    if (!items.length) {
        container.innerHTML =
            '<div class="empty">No folders found.</div>';
        return;
    }

    items.forEach(item => {
        const folderName = String(item.name)
            .replace(/^\/+|\/+$/g, "");

        const card = createCard(
            "📁",
            folderName,
            "Directory",
            () => {
                historyStack.push(currentPath);

                const base = currentPath.replace(/^\/+|\/+$/g, "");

                currentPath = (base ? base + "/" : "")
                    + folderName + "/";

                loadDirectory();
            }
        );

        container.appendChild(card);
    });
}


function renderFiles(items) {

    const container = document.getElementById("files");

    container.innerHTML = "";

    if (!items.length) {
        container.innerHTML =
            '<div class="empty">No HTML files found.</div>';
        return;
    }

    items.forEach(item => {

        const card = createCard(
            "🌐",
            item.name,
            formatSize(item.size),
            () => {
                const url = "/" +
                    encodePath(currentPath + item.name);

                window.open(url, "_blank");
            }
        );

        container.appendChild(card);

    });
}

function createCard(icon, name, meta, callback) {

    const card = document.createElement("div");
    card.className = "card";

    const iconElement = document.createElement("div");
    iconElement.className = "card-icon";
    iconElement.textContent = icon;

    const nameElement = document.createElement("div");
    nameElement.className = "card-name";
    nameElement.textContent = name;

    const metaElement = document.createElement("div");
    metaElement.className = "card-meta";
    metaElement.textContent = meta;

    card.append(
        iconElement,
        nameElement,
        metaElement
    );

    card.dataset.name = name.toLowerCase();

    card.onclick = callback;

    return card;
}

function renderBreadcrumb() {

    const container = document.getElementById("breadcrumb");

    container.innerHTML = "";

    const home = document.createElement("span");
    home.textContent = "🏠 Home";

    home.onclick = goHome;

    container.appendChild(home);

    let path = "";

    currentPath.split("/").filter(Boolean).forEach(part => {

        path += part + "/";

        const separator = document.createElement("span");
        separator.textContent = " / ";

        container.appendChild(separator);

        const link = document.createElement("span");
        link.textContent = part;

        const destination = path;

        link.onclick = () => {
            currentPath = destination;
            historyStack = [];
            loadDirectory();
        };

        container.appendChild(link);

    });
}

function goBack() {

    if (!historyStack.length) return;

    currentPath = historyStack.pop();

    loadDirectory();
}

function goHome() {

    currentPath = "";
    historyStack = [];

    loadDirectory();
}

function applySearch() {

    document.querySelectorAll(".card").forEach(card => {

        card.style.display =
            card.dataset.name.includes(searchQuery)
            ? ""
            : "none";

    });

}

document.getElementById("search").addEventListener(
    "input",
    event => {

        searchQuery = event.target.value.toLowerCase();

        applySearch();

    }
);

function formatSize(size) {

    if (!size) return "HTML Document";

    const units = ["B", "KB", "MB", "GB"];

    let value = Number(size);
    let index = 0;

    while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index++;
    }

    return value.toFixed(1) + " " + units[index];
}

function encodePath(path) {

    return path.split("/").map(encodeURIComponent).join("/");
}

function escapeHTML(value) {

    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);

}

// Initialisierung
loadDirectory();

// Optional: Alle 60 Sekunden aktualisieren
setInterval(loadDirectory, 60000);

</script>

</body>
</html>
